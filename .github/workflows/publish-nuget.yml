name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build package without pushing to NuGet"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Sw1f1FlowEcs.csproj

      - name: Build netstandard2.1
        run: dotnet build Sw1f1FlowEcs.csproj --configuration Release --framework netstandard2.1 --no-restore

      - name: Build net8.0
        run: dotnet build Sw1f1FlowEcs.csproj --configuration Release --framework net8.0 --no-restore

      - name: Pack
        run: dotnet pack Sw1f1FlowEcs.csproj --configuration Release --no-build

      - name: NuGet login
        if: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: sw1f1

      - name: Push to NuGet
        if: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
